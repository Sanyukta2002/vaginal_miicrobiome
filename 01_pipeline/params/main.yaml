# nf-core/ampliseq 2.18.0, full run. DADA2 settings follow the original study's SI.
input:    assets/samplesheet_all.csv          # 2,179 swabs + 101 EC + 61 NTC + 26 mocks
metadata: assets/metadata_ampliseq.tsv
outdir:   results/main

# Primers are not in the deposited reads, so cutadapt is skipped (recorded for provenance)
FW_primer: GTGYCAGCMGCCGCGGTAA                # 515F-Y
RV_primer: GGACTACNVGGGTWTCTAAT               # 806RB
skip_cutadapt: true

trunclenf: 245
trunclenr: 235
max_ee: 2
truncq: 2

# Near-empty negative controls must not stop the run
ignore_empty_input_files: true
ignore_failed_filtering: true

# SILVA 123 (used in the original study) is not available in ampliseq; 138 is used
dada_ref_taxonomy: silva=138
dada_min_boot: 50
skip_dada_addspecies: false
dada_addspecies_allowmultiple: false
dada_assign_chunksize: 5000

# No abundance filtering in the pipeline; filtering and analysis are done in R
min_frequency: 1
min_samples: 1
decontam: none
skip_qiime: true

# Aggregate quality plots failed on 2,367 samples; truncation was chosen from the pilot's plots
skip_dada_quality: true
